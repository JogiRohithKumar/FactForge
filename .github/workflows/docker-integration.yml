name: Docker Integration
on:
  push:
    branches: [main, "engineering/**"]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral integration secrets
        run: |
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET_KEY=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" > .env
      - name: Build and start the full stack
        run: docker compose up --build -d
      - name: Wait for API and frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8000/ready >/dev/null && curl --silent --fail http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify registration, authenticated analysis and private history
        run: |
          curl --fail --silent --show-error -c cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"email":"integration@example.com","password":"FactForgeIntegrationPassword123"}' \
            http://localhost:8000/auth/register
          curl --fail --silent --show-error -b cookies.txt http://localhost:8000/auth/me
          curl --fail --silent --show-error -b cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"text":"The city authority published the annual transport statistics after the committee reviewed the official report."}' \
            http://localhost:8000/api/v1/analyze/text
          curl --fail --silent --show-error -b cookies.txt http://localhost:8000/history
      - name: Stop stack
        if: always()
        run: docker compose down -v
